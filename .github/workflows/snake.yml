name: Generate Snake

on:
  schedule:
    # Atualiza a cada 24 horas automaticamente
    - cron: "0 0 * * *" 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: Platane/snk@v3
        with:
          # O nome do seu usuário
          github_user_name: ${{ github.repository_owner }}
          
          # Gera os arquivos customizados com a cobrinha na cor Lilás do seu tema
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#C3B1E1
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#C3B1E1
            
      - name: Push para a branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
